name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TvAudio-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish the APK at a fixed public link:
      # https://github.com/<owner>/<repo>/releases/download/apk/TvAudio.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TvAudio.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk TvAudio.apk \
            --target "$GITHUB_SHA" \
            --title "TvAudio (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Direct link: https://github.com/${GITHUB_REPOSITORY}/releases/download/apk/TvAudio.apk"
