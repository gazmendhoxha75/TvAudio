plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gaz.tvaudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gaz.tvaudio'
        minSdk 29          // Android 10: first version that can capture other apps' sound
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
